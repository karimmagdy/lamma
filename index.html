<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لمّة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3efe4">
<meta name="description" content="لمّة: ألعاب أونلاين تلعبها مع صحابك، لحد 8 لاعبين في الأوضة.">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/app.css?v=12">
</head>
<body>
<div id="app">
  <!-- HOME -->
  <section class="screen" id="s-home">
    <header class="brand">
      <h1>لمّة</h1>
      <p class="muted">ألعاب تلعبها مع صحابك أونلاين. اعمل أوضة، ابعت اللينك، ولحد 8 يلعبوا مع بعض.</p>
    </header>
    <div class="field"><label for="my-name">اسمك</label><input id="my-name" maxlength="14" autocomplete="off" placeholder="كريم"></div>
    <h2 class="sect">اختار لعبة</h2>
    <div class="gamegroups" id="game-list"></div>
    <div class="joinbox">
      <div class="or">أو صاحبك عامل أوضة؟</div>
      <div class="joinrow">
        <input id="join-code" maxlength="5" autocomplete="off" placeholder="الكود" aria-label="كود الأوضة">
        <button id="btn-join-code">ادخل</button>
      </div>
      <p class="err" id="home-err" hidden></p>
    </div>
  </section>

  <!-- JOIN BY LINK -->
  <section class="screen center" id="s-join" hidden>
    <p class="muted">صاحبك عازمك على لمّة</p>
    <div class="code" id="jn-code"></div>
    <div class="field wide"><label for="name-join">اسمك</label><input id="name-join" maxlength="14" autocomplete="off" placeholder="سارة"></div>
    <button class="stamp wide" id="btn-join">ادخل الأوضة</button>
    <button class="ghost wide" id="btn-join-cancel">لأ، رجوع</button>
  </section>

  <!-- LOBBY -->
  <section class="screen" id="s-lobby" hidden>
    <div class="lobbyhead">
      <div>
        <p class="muted">الأوضة</p>
        <h2 id="lb-game"></h2>
      </div>
      <div class="code small" id="lb-code"></div>
    </div>
    <div class="linkbox" id="lb-link"></div>
    <div class="row">
      <button id="btn-copy">انسخ اللينك</button>
      <button class="ghost" id="btn-wa">ابعته واتساب</button>
      <button class="ghost" id="btn-share" hidden>شارك…</button>
    </div>
    <h3 class="sect" id="lb-count"></h3>
    <ul class="players" id="lb-players"></ul>
    <div id="lb-host" hidden>
      <label class="muted" for="lb-pick">اللعبة</label>
      <select id="lb-pick"></select>
      <div id="lb-settings" class="settings"></div>
      <button class="stamp" id="btn-start">ابدأ اللعب</button>
      <p class="hint" id="lb-need"></p>
    </div>
    <div id="lb-guest" hidden><div class="strip" id="lb-set-sum"></div><p class="hint">مستني صاحب الأوضة يبدأ…</p></div>
    <div class="spacer"></div>
    <button class="ghost" id="btn-lobby-leave">اخرج من الأوضة</button>
  </section>

  <!-- GAME -->
  <section class="screen" id="s-game" hidden>
    <div class="gamebar">
      <button class="ghost tiny" id="btn-game-menu" aria-label="القايمة">☰</button>
      <span class="gname" id="gm-name"></span>
      <span class="gcode" id="gm-code"></span>
    </div>
    <div id="game-root" class="game-root"></div>
  </section>

  <!-- GAME MENU -->
  <section class="screen center" id="s-menu" hidden>
    <h2>القايمة</h2>
    <ul class="players" id="mn-players"></ul>
    <button class="ghost wide" id="btn-menu-back">رجوع للعبة</button>
    <button class="wide" id="btn-menu-lobby" hidden>رجّع الكل للأوضة</button>
    <button class="ghost wide" id="btn-menu-leave">اخرج من الأوضة</button>
  </section>

  <!-- WAIT / ERROR -->
  <section class="screen center" id="s-wait" hidden>
    <span class="dot wait big"></span>
    <h2 id="wt-title">بيوصل…</h2>
    <p class="muted" id="wt-sub"></p>
    <div class="linkbox" id="wt-link" hidden></div>
    <button class="stamp wide" id="btn-wait-retry" hidden>جرّب تاني</button>
    <button class="ghost wide" id="btn-wait-home">الرئيسية</button>
  </section>
</div>
<canvas class="confetti" id="confetti" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/kit.js?v=12"></script>
<script src="games/bingo.js?v=12"></script>
<script src="games/alwan.js?v=12"></script>
<script src="games/ludo.js?v=12"></script>
<script src="games/draw.js?v=12"></script>
<script src="games/words.js?v=12"></script>
<script src="games/alpha.js?v=12"></script>
<script src="games/quiz.js?v=12"></script>
<script src="games/bluff.js?v=12"></script>
<script src="js/app.js?v=12"></script>
</body>
</html>
